name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (CMake)
        run: cmake --build build

      - name: Test (CTest)
        run: ctest --test-dir build --output-on-failure

      - name: Test (Makefile flow)
        run: make test
